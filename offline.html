<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXONTECH · Sin conexión</title>
  <link rel="stylesheet" href="./app.css?v=15">
  <style>
    body{
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;background:linear-gradient(135deg,var(--blue-dk),var(--blue));
      color:#fff;text-align:center;padding:20px;
    }
    .offline-box{
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
      border-radius:18px;padding:32px 28px;max-width:380px;backdrop-filter:blur(10px);
    }
    .offline-icon{font-size:64px;margin-bottom:10px;}
    h1{font-size:20px;font-weight:800;letter-spacing:1px;margin-bottom:8px;}
    p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.6;margin-bottom:16px;}
    .btn-retry{
      background:#fff;color:var(--blue);border:none;border-radius:10px;
      padding:11px 22px;font-size:13px;font-weight:800;cursor:pointer;
      transition:transform .15s;
    }
    .btn-retry:hover{transform:scale(1.03);}
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <h1>Sin conexión</h1>
    <p>No se pudo cargar AXONTECH. Verifica tu conexión a internet e inténtalo de nuevo. Tu trabajo sin conexión se sincronizará automáticamente cuando vuelvas a estar en línea.</p>
    <button class="btn-retry" onclick="window.location.reload()">🔄 Reintentar</button>
  </div>
</body>
</html>
